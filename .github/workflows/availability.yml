name: Disponibilidade

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar API de produção
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 \
            --max-time 20 \
            https://speek-it-2.vercel.app/api/monitoring/health
